<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Webpage Demo</h1>

    <!-- Box -->
    <div class="box" onclick="resizeBox(this)"></div>

    <!-- Text -->
    <p class="text" onclick="changeText(this)">
        Click this text to change it
    </p>

    <!-- Buttons -->
    <button onclick="toggleBackground(this)">Change Button Color</button>
    <button onclick="hideText()">Hide / Show Text</button>

    <!-- Circle -->
    <div class="circle" onmouseover="moveCircle(this)"></div>

    <!-- Icon -->
    <div class="icon" onclick="rotateIcon(this)">★</div>

    <script src="script.js"></script>
</body>
</html>
